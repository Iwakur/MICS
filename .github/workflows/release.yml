name: Test and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mics_hub_test
          POSTGRES_USER: mics_hub
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mics_hub -d mics_hub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install frontend dependencies
        run: npm ci

      - name: Run the complete quality gate
        run: composer check

      - name: Verify PostgreSQL migrations, rollback, and seeders
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: mics_hub_test
          DB_USERNAME: mics_hub
          DB_PASSWORD: test-password
        run: |
          php artisan migrate:fresh --seed --force
          php artisan migrate:rollback --step=1 --force
          php artisan migrate --force
          php artisan db:seed --force

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests against PostgreSQL
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: http://127.0.0.1:8000
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: mics_hub_test
          DB_USERNAME: mics_hub
          DB_PASSWORD: test-password
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
          SESSION_DRIVER: database
          CACHE_STORE: array
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/ci-server.log 2>&1 &
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/login > /dev/null
          npm run test:e2e

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use semantic version format, for example v1.0.0." >&2
            exit 1
          fi
          version="${tag#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Refuse to overwrite an existing version
        env:
          IMAGE: ghcr.io/iwakur/mics
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION already exists. Published release versions are immutable." >&2
            exit 1
          fi

      - name: Build and publish exact release version
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/iwakur/mics:${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
